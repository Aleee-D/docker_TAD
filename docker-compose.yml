  #    MYSQL_ROOT_PASSWORD: root_prog
  #    MYSQL_DATABASE: taller_db
  #    MYSQL_USER: taller
  #    MYSQL_PASSWORD: prog
  #  ports:
  #    - "3306:3306"
  #  volumes:
  #    - mysql_data:/var/lib/mysql

volumes:
  bashhistory:
  mysql_data:

